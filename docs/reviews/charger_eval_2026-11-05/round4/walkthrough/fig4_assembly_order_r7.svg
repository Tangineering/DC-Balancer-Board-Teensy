<text x="28.0" y="451.0" font-size="11" fill="#7b1fa2">L-FC height (&lt;= 5.0 mm basis)</text>
<text x="28.0" y="465.0" font-size="11" fill="#7b1fa2">-&gt; 3-D spacer heights at PM4 (6)</text>
<line x1="250.0" y1="430.0" x2="298.0" y2="674.0" stroke="#7b1fa2" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ap)"/>
<rect x="930.0" y="560.0" width="230.0" height="50.0" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2" rx="5"/>
<text x="938.0" y="576.0" font-weight="bold" fill="#7b1fa2">MS2 (gates PM0)</text>
<text x="938.0" y="591.0" font-size="11" fill="#7b1fa2">under-MB clearance</text>
<text x="938.0" y="605.0" font-size="11" fill="#7b1fa2">-&gt; tail cut length at PM4 (4)</text>
<line x1="930.0" y1="570.0" x2="862.0" y2="568.0" stroke="#7b1fa2" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ap)"/>
<rect x="930.0" y="660.0" width="230.0" height="50.0" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2" rx="5"/>
<text x="938.0" y="676.0" font-weight="bold" fill="#7b1fa2">MS2 (gates PM0)</text>
<text x="938.0" y="691.0" font-size="11" fill="#7b1fa2">chassis-tie points, EVM plate</text>
<text x="938.0" y="705.0" font-size="11" fill="#7b1fa2">-&gt; W3/W4/W6/W7 maxima at PM4 (6)</text>
<line x1="930.0" y1="670.0" x2="862.0" y2="714.0" stroke="#7b1fa2" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ap)"/>
<rect x="930.0" y="800.0" width="230.0" height="50.0" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2" rx="5"/>
<text x="938.0" y="816.0" font-weight="bold" fill="#7b1fa2">MS5 (gates PM0: feet)</text>
<text x="938.0" y="831.0" font-size="11" fill="#7b1fa2">peak MB acceleration &lt;= 30 g;</text>
