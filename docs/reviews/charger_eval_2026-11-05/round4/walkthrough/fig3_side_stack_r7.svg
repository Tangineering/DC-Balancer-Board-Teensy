<text x="30.0" y="635.0" font-size="11" fill="#c62828">The W5 ribbon (8.89 mm wide) and the trunk envelope (half-width 2.37 mm) overlap in plan on the +y runs (x 25.80 / x 28.70) from y 57.00, and on the whole +x run across tab Y and off the CR to A1.</text>
<text x="30.0" y="650.0" font-size="11" fill="#c62828">The heights conflict from B1 (25.80, 64.50), where the trunk rises, to A1.</text>
<text x="30.0" y="665.0" font-size="11" fill="#c62828">The centre lines cross at (28.70, 69.60). Both heights are H.23(l) minimums (14.41 and 15.00 mm), B3/S3 is one merged spot, and the design states no vertical order of the two runs.</text>
<text x="30.0" y="680.0" font-size="11" fill="#c62828">A stacked height needs the bundle's vertical thickness, which neither the design nor the calc states; this drawing shows both runs at their minimums, so they intersect here.</text>
<text x="30.0" y="702.0" font-size="11" fill="#555">Heights: H.23(i) foot budget, H.23(j) stack, H.23(l) 3-D rule (H_LFC 5.0 mm ASSUMPTION, MS3 caliper); MB and CR 1.6 mm assumed (MS6).</text>
