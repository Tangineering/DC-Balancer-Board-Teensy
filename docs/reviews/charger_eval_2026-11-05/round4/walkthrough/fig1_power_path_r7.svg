<text x="408.0" y="366.0" font-size="11">T1/T2 dividers via R170/R171 (V-MOT, VBUS)</text>
<text x="408.0" y="380.0" font-size="11">Teensy EN nets, 3V3, pins 5/6/7/18/19 ...</text>
<text x="408.0" y="394.0" font-size="11">Kelvin at SNS-BT; T22 to BQ29200 pin 8</text>
<text x="408.0" y="408.0" font-size="11">via J1/J2 Teensy breakout</text>
<rect x="408.0" y="422.0" width="262.0" height="14.0" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
<text x="412.0" y="433.0" font-size="11" fill="#7b1fa2">r7: 20 pads on tab X + F08-F10, F22 on footprint</text>
<path d="M680 345 H698 V295 H712" stroke="#b08900" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
<rect x="20.0" y="540.0" width="1280.0" height="98.0" fill="#f6f6f6" stroke="#999" stroke-width="1"/>
<text x="30.0" y="560.0" font-weight="bold">One ground.</text>
<text x="110.0" y="560.0">FC return, pack negative and the charger input and battery returns are all MB GND. The BQ25798 senses on the BAT+ / input</text>
<text x="30.0" y="577.0">side, so a common ground is legal. The EVM and the EIB share the EVM plate (r7); the EIB's only circuit change in r7 is R276.</text>
<text x="30.0" y="594.0">Loop to prevent: VBUS -&gt; charger -&gt; pack -&gt; BT boost -&gt; VBUS. It needs BT_BUS closed while the charger is fed from VBUS;</text>
<text x="30.0" y="611.0">the permit logic on the CR forbids exactly that (design F.3). r7 moved no net, threshold or timing; r8 adds R106s in the FLT</text>
<text x="30.0" y="628.0">readback path (CHG-R1-01) and states its firmware changes as requirements only (G.2, D.5).</text>
