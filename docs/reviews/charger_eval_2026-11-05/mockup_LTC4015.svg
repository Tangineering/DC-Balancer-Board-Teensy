<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica,Arial,sans-serif" font-size="12">
<rect width="1100" height="560" fill="#fff"/>
<text x="20" y="24" font-size="16" font-weight="bold">Path A mockup: DC2039A (LTC4015) on Ag105 pads, board rev 20260622 (EVM values [REC]/UNVERIFIED)</text>
<g stroke="#222" fill="none" stroke-width="1.5">
 <rect x="20" y="60" width="330" height="440" rx="6"/>
 <rect x="440" y="60" width="640" height="300" rx="6" stroke-dasharray="6 3"/>
 <rect x="40" y="90" width="120" height="40"/><rect x="40" y="160" width="120" height="40"/>
 <rect x="40" y="380" width="120" height="40"/><rect x="200" y="380" width="120" height="40"/>
 <rect x="230" y="120" width="100" height="200" fill="#f3f3f3"/>
 <rect x="470" y="100" width="70" height="40"/><rect x="560" y="100" width="70" height="40"/>
 <rect x="650" y="100" width="70" height="40"/><rect x="740" y="100" width="70" height="40"/>
 <rect x="830" y="100" width="70" height="40"/><rect x="920" y="100" width="80" height="40"/>
 <rect x="470" y="220" width="250" height="110"/>
 <rect x="760" y="220" width="300" height="110"/>
</g>
<text x="30" y="78" font-weight="bold">Main board (current, Ag105 removed)</text>
<text x="48" y="108">D-BC-FC RT1987</text><text x="48" y="123">VBUS 16.0V, pin31</text>
<text x="48" y="178">D-BC-RG RT1987</text><text x="48" y="193">V-MOT, pin30</text>
<text x="48" y="398">D-BT-SQ RT1987</text><text x="48" y="413">kept, pin32</text>
<text x="208" y="398">Pack 2S 7.4-8.4V</text><text x="208" y="413">VBT; GND = pack-</text>
<text x="238" y="140" font-weight="bold">Ag105 pads</text>
<text x="238" y="160">10 VIN+ (VCHG-IN)</text><text x="238" y="178">4 VIN- = GND</text>
<text x="238" y="196">18/19 VBAT+ (VCHG)</text><text x="238" y="214">14/15 VBAT- = GND</text>
<text x="238" y="232">8/7 SDA/SCL</text><text x="238" y="250">11 MPPTD -&gt; pin5</text>
<text x="238" y="268">3 STAT -&gt; pin6</text><text x="238" y="286">13 THERM (J-NTC)</text>
<text x="238" y="304">+ adapter, M7</text>
<text x="40" y="240">C-D8/C-D10 -&gt; 10uF/50V</text><text x="40" y="256">CHG-V divider -&gt; pin38</text>
<text x="40" y="460">One GND node: VIN-, VBAT-, pack-</text><text x="40" y="476">(R-GND; no shunt, no FET)</text>
<text x="450" y="78" font-weight="bold">DC2039A off-board, 150 mm 20 AWG twisted pairs</text>
<text x="474" y="118">Damper</text><text x="474" y="132">10u+0.15R</text>
<text x="566" y="118">INFET</text><text x="566" y="132">(no bypass)</text>
<text x="654" y="118">RSNSI</text><text x="654" y="132">32 mOhm</text>
<text x="744" y="118">SYS cer</text><text x="744" y="132">&gt;=20uF eff</text>
<text x="836" y="118">Buck+L</text><text x="836" y="132">355kHz</text>
<text x="924" y="118">RSNSB</text><text x="924" y="132">12 mOhm</text>
<text x="478" y="240" font-weight="bold">UVCLFB / enable (M4, M7)</text>
<text x="478" y="258">150k/10.0k 0.1% -&gt; 19.20 V (POR)</text>
<text x="478" y="276">I2C 0x16=179 -&gt; 13.50 V (FC only)</text>
<text x="478" y="294">Q1 UVCLFB-&gt;GND, gate&lt;-INTVCC/100k</text>
<text x="478" y="312">Q2 pulls Q1 gate, gate&lt;-pin5 (47k pd)</text>
<text x="768" y="240" font-weight="bold">SMBus / misc</text>
<text x="768" y="258">addr 0x68 [REC]; DVCC &lt;- Teensy 3V3</text>
<text x="768" y="276">EVM pull-ups REMOVED; 100 kHz</text>
<text x="768" y="294">SMBALERT -&gt; pin6 INPUT_PULLUP</text>
<text x="768" y="312">NTC 10k B3435 on pack; MPPT OFF</text>
<g stroke="#c0392b" stroke-width="2.5" fill="none">
 <path d="M160 110 H200 V160 H230"/><path d="M160 180 H200"/>
 <path d="M330 160 H400 V120 H470"/>
 <path d="M1000 120 H1060 V420 H400 V196 H330"/>
</g>
<g stroke="#2c7" stroke-width="2.5" fill="none"><path d="M230 196 H190 V360 H100 V380"/><path d="M160 400 H200"/></g>
<g stroke="#2a5db0" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
 <path d="M330 232 H420 V300 H760"/><path d="M330 250 H430 V312 H470"/><path d="M330 268 H440 V340 H760"/>
 <path d="M330 196 H380 V440 H1070"/>
</g>
<text x="410" y="152" fill="#c0392b">VIN pair, &lt;=1.0 A</text>
<text x="700" y="415" fill="#c0392b">BAT pair, &lt;=2.5 A</text>
<text x="700" y="455" fill="#2a5db0">BATSENS Kelvin to pad 18 (VCHG), never to VBT</text>
<text x="450" y="500" font-size="11">Inrush: RT1987 slew 12.0 V/ms (C_SS 5.6 nF) =&gt; 12 mA/uF; 49-59 uF eff =&gt; 0.59-0.71 A (FC budget 1.0 A, OC_FC 1.4 A). No electrolytics (470 uF = 5.6 A, Death-5).</text>
<text x="450" y="518" font-size="11">R3: UVCL 19.2 V &gt; TPS61288 OVP min 18.3 V &gt; FW OV 17.5 V &gt; VBUS 16.0 V; RSNSI bounds a failure at 1.0 A (~16 W vs 170 W in ML0227).</text>
<text x="450" y="536" font-size="11">CV: 8.400 V max code, D-BT-SQ -35 mV =&gt; pack 8.365 V (-0.42 %). Charge 2.50 A (ICHARGE 29) regen; FC ~1.4-1.75 A (input-limited).</text>
</svg>
