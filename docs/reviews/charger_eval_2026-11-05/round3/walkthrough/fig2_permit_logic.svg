<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="980" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="28" font-size="16" font-weight="bold">Fig 2. Permit logic on the CR carrier (simplified from design B.1)</text><text x="20" y="46" font-size="12" fill="#555">Every input reads its SAFE value (permit removed) when its tap wire breaks or its source is unpowered.</text>
<g font-size="11">
<!-- inputs -->
<g fill="#eef3fb" stroke="#335">
<rect x="20" y="55" width="270" height="30"/><rect x="20" y="92" width="270" height="30"/><rect x="20" y="129" width="270" height="30"/>
<rect x="20" y="166" width="270" height="30"/><rect x="20" y="203" width="270" height="30"/><rect x="20" y="240" width="270" height="30"/>
<rect x="20" y="277" width="270" height="30"/><rect x="20" y="314" width="270" height="30"/>
</g>
<text x="28" y="74"><tspan font-weight="bold">H1</tspan> (U102): V-MOT &gt; 1.089 x VBUS </text>
<text x="28" y="111"><tspan font-weight="bold">RGN_ON</tspan> (U121): REGEN EN &gt; 1.75-1.88 V</text>
<text x="28" y="148"><tspan font-weight="bold">FCC_OFF</tspan> (U119): FC_CHARGE EN &lt; 0.39-0.44 V</text>
<text x="28" y="185"><tspan font-weight="bold">FCC_ON</tspan> (U120): FC_CHARGE EN &gt; 1.75-1.88 V</text>
<text x="28" y="222"><tspan font-weight="bold">UVB</tspan> (U103): VBUS &gt; 13.3 V</text>
<text x="28" y="259"><tspan font-weight="bold">BTB_OFF</tspan> (U115): BT_BUS EN &lt; 0.39-0.44 V</text>
<text x="28" y="296"><tspan font-weight="bold">BT_OK</tspan> (U104): BT boost current &lt; ~0.06-0.34 A</text>
<text x="28" y="333"><tspan font-weight="bold">FCCEIL</tspan> (Teensy 17): FC-window registers read back</text>
</g>
<!-- H1q -->
<rect x="360" y="70" width="220" height="60" fill="#fff4d6" stroke="#a07000" stroke-width="2"/>
<text x="370" y="90" font-weight="bold">H1q: regen-path permit</text>
<text x="370" y="107">H1 . RGN_ON . FCC_OFF . UVB</text>
<text x="370" y="122" font-size="11" fill="#555">bus cannot feed V-MOT; pack may be on the bus</text>
<!-- H2c -->
<rect x="360" y="200" width="220" height="74" fill="#fff4d6" stroke="#a07000" stroke-width="2"/>
<text x="370" y="220" font-weight="bold">H2c: FC-window permit</text>
<text x="370" y="237">FCC_ON . BTB_OFF . BT_OK .</text>
<text x="370" y="252">[ (UVB . FCCEIL) + (H1 . RGN_ON) ]</text>
<text x="370" y="267" font-size="11" fill="#555">pack proven OFF the bus</text>
<path d="M290 70 H340 V95 H360 M290 107 H335 V100 H360 M290 144 H340 V110 H360 M290 218 H325 V118 H360" stroke="#888" fill="none"/>
<path d="M290 181 H345 V215 H360 M290 255 H350 V230 H360 M290 292 H350 V245 H360 M290 329 H355 V258 H360" stroke="#888" fill="none"/>
<!-- OR -->
<rect x="630" y="140" width="110" height="50" fill="#f0f0f0" stroke="#222"/>
<text x="640" y="160" font-weight="bold">GATE = OR</text><text x="640" y="177" font-size="11">(+ Run-entry one-shot)</text>
<path d="M580 100 H605 V155 H630 M580 237 H605 V175 H630" stroke="#222" fill="none" stroke-width="1.5"/>
<!-- ARM_OK' -->
<rect x="300" y="380" width="440" height="76" fill="#fde2e2" stroke="#a03030" stroke-width="2"/>
<text x="310" y="400" font-weight="bold">ARM_OK' = heartbeat . OVN</text>
<text x="310" y="417">heartbeat: SN74LVC1G123 monostable on Teensy pin 21; falls 20-46 ms</text>
<text x="310" y="432">after the last edge, so a hung or reset MCU removes every permit.</text>
<text x="310" y="447">OVN: BQ29200 cell OVP (4.35 V/cell for 1.6-4.9 s) via its unused OUT pin.</text>
<!-- P5 -->
<rect x="20" y="470" width="270" height="30" fill="#eef3fb" stroke="#335"/>
<text x="28" y="489"><tspan font-weight="bold">P5 / CHG_ARM</tspan> (Teensy 5): firmware armed</text>
<!-- outputs -->
<rect x="790" y="140" width="175" height="76" fill="#dff2df" stroke="#2a7a2a" stroke-width="2"/>
<text x="798" y="160" font-weight="bold">ILIM_REL = GATE . ARM_OK'</text><text x="798" y="177">releases ILIM_HIZ:</text><text x="798" y="192">converter may switch</text><text x="798" y="207" font-size="11" fill="#555">(else held &lt; 0.75 V = off)</text>
<rect x="790" y="430" width="175" height="76" fill="#dff2df" stroke="#2a7a2a" stroke-width="2"/>
<text x="798" y="450" font-weight="bold">CE_DRV = P5 . ARM_OK'</text><text x="798" y="467">pulls /CE LOW:</text><text x="798" y="482">charging allowed</text><text x="798" y="497" font-size="11" fill="#555">(else /CE pulled to REGN)</text>
<rect x="770" y="270" width="200" height="76" fill="#eeeeee" stroke="#222"/>
<text x="776" y="290" font-weight="bold" font-size="11">RFC_OFF = FCC_OFF + H1 . RGN_ON</text><text x="776" y="307">HIGH: regen clamp</text><text x="776" y="322">1.33-1.76 A</text><text x="776" y="337">LOW: FC clamp 0.65-0.95 A</text>
<path d="M740 165 H790" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M740 400 H760 V200 H790" stroke="#a03030" stroke-width="1.5" fill="none"/>
<path d="M740 440 H790" stroke="#a03030" stroke-width="1.5" fill="none"/>
<path d="M290 485 H770 V475 H790" stroke="#335" stroke-width="1.5" fill="none"/>
<text x="20" y="535" font-size="12">Both outputs need ARM_OK'. Charging needs BOTH /CE LOW and ILIM_HIZ released, so the two outputs are independent barriers: either one alone stops the charger.</text>
<text x="20" y="552" font-size="12">Why comparators on the EN nets, not logic gates: an RT1987 may be ON anywhere above 0.6 V, and a 74LVC input is undefined between 0.8 and 2.0 V.</text>
</svg>
